[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

filterwarnings =
    ignore::DeprecationWarning:httpx._models
    # LiteLLM's response objects don't line up with the newer pydantic serializer.
    # Harmless, but it prints a wall of text at the end of every test run.
    ignore:Pydantic serializer warnings:UserWarning
